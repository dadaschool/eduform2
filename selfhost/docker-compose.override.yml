# 외부 접속 차단용 덮어쓰기 설정.
#
# 사용법: 이 파일을 supabase/docker/ 폴더에 복사하면 docker compose 가
# 자동으로 함께 읽습니다. 별도 옵션이 필요 없습니다.
#
#   cp selfhost/docker-compose.override.yml /경로/supabase/docker/
#   cd /경로/supabase/docker && docker compose up -d
#
# 기본 설정은 포트를 0.0.0.0(모든 인터페이스)에 엽니다. 학생 개인정보를
# 다루므로 아래처럼 좁힙니다. 방화벽에서도 한 번 더 막으세요 (SELFHOST.md 4단계).

services:
  # 관리 화면. 여기서 모든 학생 데이터를 열람·수정할 수 있습니다.
  # 서버 안에서만 열리게 하고, 필요하면 SSH 터널로 접근하세요.
  #   ssh -L 3000:localhost:3000 사용자@서버
  studio:
    ports:
      - "127.0.0.1:3000:3000/tcp"

  # API 게이트웨이. 앱(Next.js)이 부르는 곳입니다.
  # 앱이 같은 서버에서 돌면 127.0.0.1 로 두세요.
  # 앱이 다른 PC 에서 돌면 아래 주석을 참고해 교내망 IP 로 바꾸세요.
  kong:
    ports:
      - "127.0.0.1:8000:8000/tcp"
      # 예) 서버 내부 IP 가 10.10.1.50 인 경우
      # - "10.10.1.50:8000:8000/tcp"
      #
      # ⚠ "8000:8000" 처럼 IP 없이 두면 모든 인터페이스에 열립니다.
      #    공유기에서 포트포워딩까지 되어 있으면 인터넷에 노출됩니다.

  # Postgres 직접 접속. npm run db:setup 과 백업에만 씁니다.
  # 앱은 이 포트를 쓰지 않으므로 외부에 열 이유가 없습니다.
  db:
    ports:
      - "127.0.0.1:5432:5432/tcp"

  # 분석 도구. 에듀폼은 쓰지 않지만 다른 서비스가 의존하므로 끄지 않고
  # 포트만 닫습니다.
  analytics:
    ports:
      - "127.0.0.1:4000:4000/tcp"
